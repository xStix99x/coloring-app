<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS Home Screen Icon -->
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/xStix99x/coloring-app/refs/heads/main/Pallete.jpeg">
    <!-- Standard Browser Tab Favicon -->
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/xStix99x/coloring-app/refs/heads/main/Pallete.jpeg">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/xStix99x/coloring-app/refs/heads/main/Pallete.jpeg">
    
    <title>Coloring Studio</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
        body { background-color: #121212; overflow: hidden; overscroll-behavior: none; touch-action: none; color: #ffffff; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 100; }
        
        /* Auto-Slimming Sidebar Styles */
        #toolbar {
            position: absolute; top: 0; bottom: 0; height: 100vh; 
            background: rgba(25, 25, 25, 0.95); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 20px 15px; display: flex; flex-direction: column; gap: 15px;
            pointer-events: auto; transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), left 0.3s ease, right 0.3s ease;
            width: 260px; overflow-x: hidden; overflow-y: auto; z-index: 100;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }
        
        #toolbar.left-side { left: 0; right: auto; border-right: 1px solid #333; border-radius: 0 16px 16px 0; }
        #toolbar.right-side { right: 0; left: auto; border-left: 1px solid #333; border-radius: 16px 0 0 16px; }
        
        /* Slim State */
        #toolbar.slim { width: 68px; padding: 20px 10px; overflow-y: hidden; }
        #toolbar.slim .hide-on-slim { display: none !important; }
        
        /* Header Buttons */
        .toolbar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; width: 100%; transition: 0.3s; }
        #toolbar.slim .toolbar-header { flex-direction: column; gap: 15px; margin-bottom: 25px; }
        
        .icon-btn { background: #2c2c2e; border: 1px solid #444; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; color: white; transition: 0.2s; flex-shrink: 0; }
        .icon-btn:active { transform: scale(0.9); }
        #lockBtn.locked { background: #ff3b30; border-color: #ff3b30; }

        /* Tools Grid */
        .tool-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; }
        #toolbar.slim .tool-grid { grid-template-columns: 1fr; gap: 12px; }
        
        .tool-btn { padding: 12px 4px; border: none; border-radius: 10px; background: #3a3a3c; color: white; cursor: pointer; transition: 0.2s; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tool-btn.active { background: #0a84ff; color: white; font-weight: bold; }
        .tool-btn:active { transform: scale(0.95); }
        
        .tool-icon { font-size: 16px; }
        #toolbar.slim .tool-icon { font-size: 22px; }
        #toolbar.slim .tool-btn { padding: 12px 0; border-radius: 50%; width: 48px; height: 48px; margin: 0 auto; }

        /* General Buttons */
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-between; margin-top: 5px; }
        .action-btn { padding: 10px 4px; flex-grow: 1; flex-basis: 45%; border: none; border-radius: 8px; background: #3a3a3c; color: white; cursor: pointer; transition: 0.2s; font-size: 13px; font-weight: bold; }
        .action-btn:active { transform: scale(0.95); }
        
        /* Colors */
        .color-section { display: flex; flex-direction: column; gap: 8px; align-items: center; }
        .color-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #a1a1a6; width: 100%; }
        .color-inputs { display: flex; gap: 12px; align-items: center; justify-content: center; }
        
        input[type="color"] { border: none; width: 46px; height: 46px; border-radius: 50%; cursor: pointer; background: none; flex-shrink: 0; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: 2px solid #555; border-radius: 50%; box-shadow: inset 0 0 4px rgba(0,0,0,0.5); }
        
        #paletteSwatches { display: grid; grid-template-columns: repeat(4, 26px); gap: 8px; }
        .swatch { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 1px solid #555; transition: transform 0.1s; }
        .swatch:active { transform: scale(0.8); }

        .palette-buttons { display: flex; gap: 4px; justify-content: space-between; width: 100%; }
        .palette-buttons button { font-size: 11px; padding: 6px 2px; flex-basis: 32%; background: #2c2c2e; border: 1px solid #444; color: white; border-radius: 6px; cursor: pointer; }
        .palette-buttons button.active-palette { background: #0a84ff; border-color: #0a84ff; font-weight: bold; }

        /* Sliders & Thickness Grid */
        .thickness-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 4px; }
        .thick-btn { background: #2c2c2e; border: 1px solid #444; border-radius: 8px; height: 36px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .thick-btn.active { background: #0a84ff; border-color: #0a84ff; }
        .thick-dot { background: #ffffff; border-radius: 50%; }

        .slider-group { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #a1a1a6; }
        .slider-group label { display: flex; justify-content: space-between; font-weight: 500; }
        input[type="range"] { width: 100%; accent-color: #0a84ff; }

        /* Viewport Canvas */
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #workspace {
            position: absolute; top: 0; left: 0; width: 1200px; height: 1600px;
            background: white; transform-origin: 0 0; box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #drawCanvas { z-index: 1; }
        #draftCanvas { z-index: 2; pointer-events: none; } 
        #topCanvas { z-index: 3; pointer-events: none; mix-blend-mode: multiply; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <!-- Sidebar Toolbar -->
        <div id="toolbar" class="left-side slim">
            
            <div class="toolbar-header">
                <button onclick="toggleSide(event)" class="icon-btn" title="Move Toolbar">⚙️</button>
                <button onclick="toggleCanvasLock(event)" class="icon-btn" id="lockBtn" title="Lock Canvas Pan">🔓</button>
            </div>
            
            <div class="color-section">
                <div class="color-header hide-on-slim">
                    <span>Color Palette</span>
                </div>
                <div class="color-inputs">
                    <input type="color" id="colorPicker" value="#0a84ff">
                    <div id="paletteSwatches" class="hide-on-slim"></div>
                </div>
                <div class="palette-buttons hide-on-slim">
                    <button id="palStandard" onclick="setPalette('standard')">Standard</button>
                    <button id="palPastel" onclick="setPalette('pastel')">Pastel</button>
                    <button id="palNeon" onclick="setPalette('neon')">Neon</button>
                </div>
            </div>
            
            <div class="tool-grid">
                <button class="tool-btn active" data-tool="marker"><span class="tool-icon">🖊️</span><span class="hide-on-slim label">Marker</span></button>
                <button class="tool-btn" data-tool="brush"><span class="tool-icon">🖌️</span><span class="hide-on-slim label">Brush</span></button>
                <button class="tool-btn" data-tool="crayon"><span class="tool-icon">🖍️</span><span class="hide-on-slim label">Crayon</span></button>
                <button class="tool-btn" data-tool="eraser"><span class="tool-icon">🧽</span><span class="hide-on-slim label">Eraser</span></button>
            </div>
            
            <div class="slider-group hide-on-slim">
                <label><span>Thickness</span> <span id="valThick">5</span></label>
                <div class="thickness-grid" id="thicknessGrid">
                    <div class="thick-btn" data-size="1"><div class="thick-dot" style="width:2px; height:2px;"></div></div>
                    <div class="thick-btn" data-size="5"><div class="thick-dot" style="width:4px; height:4px;"></div></div>
                    <div class="thick-btn" data-size="10"><div class="thick-dot" style="width:7px; height:7px;"></div></div>
                    <div class="thick-btn" data-size="20"><div class="thick-dot" style="width:10px; height:10px;"></div></div>
                    <div class="thick-btn" data-size="40"><div class="thick-dot" style="width:14px; height:14px;"></div></div>
                    <div class="thick-btn" data-size="60"><div class="thick-dot" style="width:18px; height:18px;"></div></div>
                    <div class="thick-btn" data-size="80"><div class="thick-dot" style="width:22px; height:22px;"></div></div>
                    <div class="thick-btn" data-size="100"><div class="thick-dot" style="width:26px; height:26px;"></div></div>
                </div>
                <input type="range" id="thicknessSlider" min="1" max="100" value="5">
            </div>

            <div class="slider-group hide-on-slim">
                <label><span>Opacity</span> <span id="valOpac">100%</span></label>
                <input type="range" id="opacitySlider" min="1" max="100" value="100">
            </div>
            <div class="slider-group hide-on-slim">
                <label><span>Zoom Limit</span> <span id="valZoom">100%</span></label>
                <input type="range" id="zoomSlider" min="10" max="200" value="100">
            </div>
            
            <div class="btn-row hide-on-slim">
                <input type="file" id="fileUpload" accept="image/jpeg, image/png, application/pdf" style="display: none;">
                <button class="action-btn" onclick="document.getElementById('fileUpload').click()">📁 Import</button>
                <button class="action-btn" onclick="saveArtwork()">💾 Save</button>
            </div>
            
            <div class="btn-row hide-on-slim">
                <button class="action-btn" onclick="clearImage()" title="Remove Imported Image" style="background: #5856d6;">❌ Reset Page</button>
                <button class="action-btn" onclick="clearCanvas()" title="Clear Colors" style="background: #ff453a;">🧹 Clear Color</button>
            </div>
        </div>
    </div>

    <div id="viewport">
        <div id="workspace">
            <canvas id="drawCanvas" width="1200" height="1600"></canvas>
            <canvas id="draftCanvas" width="1200" height="1600"></canvas>
            <canvas id="topCanvas" width="1200" height="1600"></canvas>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const workspace = document.getElementById('workspace');
        const drawCanvas = document.getElementById('drawCanvas');
        const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
        const draftCanvas = document.getElementById('draftCanvas');
        const draftCtx = draftCanvas.getContext('2d', { willReadFrequently: true });
        const topCanvas = document.getElementById('topCanvas');
        const topCtx = topCanvas.getContext('2d', { willReadFrequently: true });
        const viewport = document.getElementById('viewport');
        
        let currentTool = 'marker';
        let currentColor = '#0a84ff';
        let currentThickness = 5;
        let currentOpacity = 1.0;

        // --- Toolbar UI Logic (Auto-Slim & Position Settings) ---
        let inactivityTimer = null;
        let toolbarSide = 'left';
        let isCanvasLocked = false;
        const toolbarEl = document.getElementById('toolbar');

        function toggleSide(e) {
            if(e) e.stopPropagation();
            if (toolbarSide === 'left') {
                toolbarSide = 'right';
                toolbarEl.classList.remove('left-side');
                toolbarEl.classList.add('right-side');
            } else {
                toolbarSide = 'left';
                toolbarEl.classList.remove('right-side');
                toolbarEl.classList.add('left-side');
            }
            resetInactivityTimer();
        }

        function toggleCanvasLock(e) {
            if(e) e.stopPropagation();
            isCanvasLocked = !isCanvasLocked;
            const btn = document.getElementById('lockBtn');
            if(isCanvasLocked) {
                btn.innerText = '🔒';
                btn.classList.add('locked');
            } else {
                btn.innerText = '🔓';
                btn.classList.remove('locked');
            }
            resetInactivityTimer();
        }

        function resetInactivityTimer() {
            toolbarEl.classList.remove('slim');
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => { 
                toolbarEl.classList.add('slim'); 
            }, 6000);
        }

        // Expand toolbar when touched anywhere inside it
        ['pointerdown', 'pointermove', 'click', 'input'].forEach(evt => {
            toolbarEl.addEventListener(evt, (e) => {
                resetInactivityTimer();
                e.stopPropagation(); // Prevents drawing underneath the toolbar
            });
        });
        resetInactivityTimer(); // Start timer on load

        // --- Color Palettes ---
        const palettes = {
            standard: ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#007AFF', '#AF52DE', '#8E8E93', '#000000'],
            pastel: ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', '#E8C5FF', '#F0F0F0', '#B0B0B0'],
            neon: ['#FF007F', '#00F0FF', '#39FF14', '#FFFF00', '#FF5F00', '#9D00FF', '#FFFFFF', '#00FFFF']
        };

        function setPalette(name) {
            document.querySelectorAll('.palette-buttons button').forEach(b => b.classList.remove('active-palette'));
            document.getElementById('pal' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active-palette');

            const container = document.getElementById('paletteSwatches');
            container.innerHTML = '';
            palettes[name].forEach(c => {
                const div = document.createElement('div');
                div.className = 'swatch'; 
                div.style.backgroundColor = c;
                div.onclick = () => updateColorFromPicker(c);
                container.appendChild(div);
            });
        }

        function updateColorFromPicker(hex) {
            currentColor = hex; 
            document.getElementById('colorPicker').value = hex;
        }

        setPalette('standard');

        // --- Crayon Noise Texture Generation ---
        const noiseCanvas = document.createElement('canvas');
        noiseCanvas.width = 300; noiseCanvas.height = 300;
        const nCtx = noiseCanvas.getContext('2d');
        nCtx.filter = 'blur(1.2px)';
        for (let x = 0; x < 300; x += 3) {
            for (let y = 0; y < 300; y += 3) {
                if (Math.random() > 0.83) {
                    nCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    nCtx.beginPath();
                    nCtx.arc(x, y, Math.random() * 1.5 + 0.5, 0, Math.PI * 2); 
                    nCtx.fill();
                }
            }
        }
        const crayonPattern = draftCtx.createPattern(noiseCanvas, 'repeat');
        let strokePatternOffset = {x: 0, y: 0};

        // --- Controls & Thickness Grid ---
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                const targetBtn = e.target.closest('.tool-btn');
                targetBtn.classList.add('active'); 
                currentTool = targetBtn.dataset.tool;
            });
        });

        const thicknessSlider = document.getElementById('thicknessSlider');
        const valThick = document.getElementById('valThick');
        const thickButtons = document.querySelectorAll('.thick-btn');

        function setThickness(val) {
            currentThickness = parseInt(val);
            thicknessSlider.value = currentThickness;
            valThick.innerText = currentThickness;

            thickButtons.forEach(btn => {
                if (parseInt(btn.dataset.size) === currentThickness) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        thickButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                setThickness(btn.dataset.size);
            });
        });

        thicknessSlider.addEventListener('input', (e) => {
            setThickness(e.target.value);
        });

        setThickness(5);

        document.getElementById('colorPicker').addEventListener('change', (e) => updateColorFromPicker(e.target.value));
        document.getElementById('colorPicker').addEventListener('input', (e) => currentColor = e.target.value);
        
        document.getElementById('opacitySlider').addEventListener('input', (e) => {
            currentOpacity = e.target.value / 100; document.getElementById('valOpac').innerText = e.target.value + '%';
        });

        function clearCanvas() {
            drawCtx.fillStyle = '#ffffff'; 
            drawCtx.fillRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        function clearImage() {
            topCtx.clearRect(0, 0, topCanvas.width, topCanvas.height);
            resizeWorkspace(1200, 1600);
        }

        // --- Pan (3 Fingers) and Zoom Sizing ---
        let scale = 1; let panX = 0, panY = 0;
        let activeTouches = new Map();

        function updateTransform() {
            workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoomSlider').value = Math.round(scale * 100);
            document.getElementById('valZoom').innerText = Math.round(scale * 100) + '%';
        }

        document.getElementById('zoomSlider').addEventListener('input', (e) => {
            scale = e.target.value / 100; updateTransform();
        });

        function resizeWorkspace(w, h) {
            workspace.style.width = w + 'px'; workspace.style.height = h + 'px';
            drawCanvas.width = w; drawCanvas.height = h;
            draftCanvas.width = w; draftCanvas.height = h;
            topCanvas.width = w; topCanvas.height = h;
            
            clearCanvas();

            const rect = viewport.getBoundingClientRect();
            scale = Math.min((rect.width - 40) / w, (rect.height - 40) / h);
            scale = Math.max(0.1, Math.min(scale, 2));
